services:
  # Node.js Web Service for Express Backend + Event Bus Engine
  - type: web
    name: project-x-server
    env: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
