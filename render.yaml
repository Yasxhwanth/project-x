services:
  # Node.js Unified Web Service (Express Backend + Vite Frontend + 24/7 Agent Engine)
  - type: web
    name: project-x-server
    env: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
